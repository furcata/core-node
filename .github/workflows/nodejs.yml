name: Node CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so the private-marker check can scan commit messages
          # and authorship across the range under review, not just the tip.
          fetch-depth: 0

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build (lint + compile)
        run: npm run build
        env:
          CI: true

      # `lib/` is committed and `exports` points at it, and there is no `prepare`
      # script — so installing this package straight from git performs no build,
      # and consumers execute the committed output. That makes `lib/` the code
      # that runs while `src/` is the code that gets reviewed. Without this check
      # a stale `lib/` passes CI green, and an approved change to `src/` silently
      # never reaches consumers: the diff looks perfectly correct, because `src/`
      # is exactly what it claims to be. Nothing in the review surface can expose
      # that, which is why it is enforced here rather than left to reviewers.
      #
      # `git status --porcelain` is used deliberately instead of the more obvious
      # `git diff --exit-code`. `git diff` only sees TRACKED files, so a NEW
      # module added under `src/` compiles to UNTRACKED files under `lib/` and
      # `git diff` exits 0 — measured, not assumed. That is precisely the case
      # that arises whenever someone adds a module, so the obvious form would
      # have been inert exactly when it was most needed.
      - name: Verify committed build output is current
        run: |
          drift="$(git status --porcelain -uall -- lib/)"
          if [ -n "$drift" ]; then
            echo "::error::lib/ is stale. Run 'npm run build' and commit the regenerated lib/ in the SAME commit as your src/ change."
            echo "Drift between the committed lib/ and a clean build of src/:"
            echo "$drift"
            echo "--- diff of tracked build output ---"
            git --no-pager diff -- lib/
            exit 1
          fi
          echo "OK: committed lib/ matches a clean build of src/."
        env:
          CI: true

      # This repository is public. Scans tracked files, commit messages and
      # authorship. Commit messages are included because they never appear in a
      # file diff and are therefore the vector least likely to be caught by
      # review. The script self-tests its own patterns on every run, so a pass
      # means the patterns were demonstrated working rather than merely trusted.
      - name: Check for private markers and attribution trailers
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -n "$BASE" ] && git rev-parse --quiet --verify "$BASE" >/dev/null 2>&1; then
            RANGE="$BASE..HEAD"
          else
            RANGE="origin/${{ github.event.repository.default_branch }}..HEAD"
          fi
          echo "Scanning range: $RANGE"
          ./.github/scripts/check-private-markers.sh "$RANGE"
        env:
          CI: true

      - name: Test
        run: npm test
        env:
          CI: true

      # `npm test` alone cannot fail on a type-level change: TypeScript interfaces
      # are erased at runtime, so a test that declares an object literal and reads
      # a property back still passes after the field is deleted from the source.
      # Verified by deleting a field from an interface and observing 480/480 tests
      # still pass. This step is what makes type-level regressions detectable, and
      # it is positive-controlled: deleting an interface field, assigning a wrong
      # type, and removing a referenced enum member each make it exit non-zero.
      - name: Typecheck (tests against source types)
        run: npm run typecheck
        env:
          CI: true

      # Neither gate above can observe how these types behave for a consumer
      # that compiles more permissively than this package does. `npm run
      # typecheck` uses this repository's own settings, where `strict`,
      # `strictNullChecks` and `noImplicitAny` are all on; a consumer need not
      # set any of them. A type-level guarantee can hold under one
      # null-checking setting and be completely inert under the other — a
      # failure branch marked `data?: undefined` errors correctly here and
      # compiles clean for a consumer with `strictNullChecks` off, because
      # `T | undefined` reduces to `T` when the flag is off. The unspoken
      # precondition of the strict gate is that the consumer shares our
      # settings, and nothing tracked it.
      #
      # This step compiles fixtures against the BUILT `lib/*.d.ts` — reached
      # through the package's own `exports` map, so it type-checks the
      # declarations consumers actually receive rather than `src/` — with
      # `strictNullChecks` and `noImplicitAny` off. It runs after the build and
      # the drift check deliberately: the declarations it reads are only
      # current because those two steps already passed.
      #
      # Mutation-validated with a 2×2, because the obvious one-cell experiment
      # gives the wrong answer. Reintroducing `data?: undefined` on the failure
      # branch turns BOTH this step and `npm run typecheck` red — the existing
      # assertions in test/interface/schema.test.ts read the SHALLOW property
      # `result.data`, and a property-existence error fires under every setting.
      # The strict gate's coverage there is incidental to how one line was
      # phrased. Rewrite those reads as `result.data.amount`, which is the
      # natural way to express the guarantee, and the marker mutation leaves
      # `npm run typecheck` GREEN (TS18048 keeps its directive used) while this
      # step goes RED with TS2578. Control cell: the same deep reads with the
      # correct type leave both green. The same 2×2 on `member?: undefined` and
      # MemberMiss behaves identically. That is the divergence this step is for.
      - name: Typecheck (published declarations under consumer conditions)
        run: npm run typecheck:consumer
        env:
          CI: true

      # Positive control for the step above, and not optional.
      #
      # A negative assertion is evidence only if the harness that produced it
      # works. "The un-narrowed read failed to compile" is produced just as
      # readily by a fixture that cannot compile at all, and both failure modes
      # are live here: TS2307, because the `exports` map exposes only `./model`
      # and `./interface` so a deep path does not resolve; and TS5112, because
      # passing files on the command line errors before any type analysis
      # happens. Both were measured. Both take the un-narrowed AND the narrowed
      # reads down together, which reads as a confirmed guarantee.
      #
      # This step compiles only the fixture whose every line must compile, so
      # the two exit codes can be read together:
      #   gate red, control green -> a guarantee regressed. Fix the type.
      #   gate red, control red   -> the harness broke. The gate above proves
      #                              nothing until it is repaired.
      - name: Typecheck control (consumer harness liveness)
        run: npm run typecheck:consumer:control
        env:
          CI: true
